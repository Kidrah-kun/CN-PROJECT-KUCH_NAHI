# nginx Configuration — Mac 2 (Abuzar Haider)
# Computer Networks Project — Team Kuch_Nahi
# Machine: Mac 2 — 10.7.19.243 — en0
#
# This file goes on Mac 2 at:
#   /opt/homebrew/etc/nginx/nginx.conf
#
# To test syntax:
#   nginx -t
#
# To start/restart:
#   brew services restart nginx
#
# To check listening:
#   sudo lsof -nP -iTCP:8443 -sTCP:LISTEN
#
# ─────────────────────────────────────────────────────────────

worker_processes  1;

events {
    worker_connections  1024;
}

http {

    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ─── Upstream backend pool (Round-robin load balancing) ─────────────
    #
    #   Backend A: Mac 3 — Kabir Sharma — 10.7.21.89:3001
    #   Backend B: Mac 4 — Ayush Tiwari — 10.7.24.95:3002
    #
    #   nginx alternates requests between A and B (round-robin by default).
    #   If one backend fails, proxy_next_upstream routes to the other.
    # ──────────────────────────────────────────────────────────────────────
    upstream backend_pool {
        server 10.7.21.89:3001 max_fails=1 fail_timeout=5s;
        server 10.7.24.95:3002 max_fails=1 fail_timeout=5s;
    }

    server {

        # ─── HTTPS on port 8443 ──────────────────────────────────────────
        # Using 8443 instead of 443 so nginx can run without sudo.
        # The project specification explicitly allows this substitution.
        # ─────────────────────────────────────────────────────────────────
        listen 8443 ssl;
        server_name app.Kuch_Nahi.test;

        # ─── TLS Certificate (self-signed, CA trusted on all client Macs) ─
        ssl_certificate     /Users/abuzarhaider/cn-project/certs/server.crt;
        ssl_certificate_key /Users/abuzarhaider/cn-project/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # ─── Proxy to backend pool ────────────────────────────────────────
        location / {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # On backend failure, automatically try next upstream
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
