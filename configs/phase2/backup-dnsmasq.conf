# dnsmasq Configuration — Backup DNS (Mac 4 / Ayush Tiwari)
# Computer Networks Project — Team Kuch_Nahi — Phase 2
# Machine: Mac 4 — 10.7.15.153 — en0
#
# Purpose: Acts as secondary DNS server.
#   All 4 Macs set DNS to: 10.7.6.152 10.7.15.153
#   If Mac 1 (primary) goes down, macOS automatically
#   falls back to this server.
#
# To apply:
#   sudo brew services restart dnsmasq
#
# To test:
#   dig @10.7.15.153 app.Kuch_Nahi.test
# ─────────────────────────────────────────────────────────────

# Listen on localhost AND on Mac 4's LAN IP
listen-address=127.0.0.1,10.7.15.153

# Bind strictly to the interfaces above
bind-interfaces

# Do NOT read /etc/resolv.conf
no-resolv

# Forward normal internet queries upstream
server=8.8.8.8
server=1.1.1.1

# ─── Private Project Domain Records ───────────────────────────
# Both names resolve to Mac 2 (Abuzar — 10.7.31.75 — primary nginx edge)
address=/app.Kuch_Nahi.test/10.7.31.75
address=/api.Kuch_Nahi.test/10.7.31.75

# TTL = 30 s (matches primary — important for TTL cutover demo)
local-ttl=30

# Log all DNS queries
log-queries

