# Nginx Configuration — Standby HTTPS Edge (Mac 3 / Kabir Sharma)
# Computer Networks Project — Team Kuch_Nahi — Phase 2
# Machine: Mac 3 — 10.7.11.100 — en0
#
# Purpose: Standby reverse proxy / load balancer.
#   Activated via DNS cutover: change dnsmasq record from
#   10.7.31.75 (Abuzar) to 10.7.11.100 (Kabir) to shift traffic.
#
# Differences from primary (Abuzar) nginx.conf:
#   - ssl_certificate paths use Kabir's username
#   - X-Edge header = "standby-mac3" (not "primary-mac2")
#
# To apply:
#   nginx -t
#   brew services restart nginx
# ─────────────────────────────────────────────────────────────

worker_processes  1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server 10.7.11.100:3001 max_fails=1 fail_timeout=10s;
        server 10.7.15.153:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        server_name app.Kuch_Nahi.test api.Kuch_Nahi.test;

        ssl_certificate     /Users/kabirsharma/cn-project/certs/server.crt;
        ssl_certificate_key /Users/kabirsharma/cn-project/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   HIGH:!aNULL:!MD5;

        # Identifies this edge in curl headers — proves cutover worked
        add_header X-Edge "standby-mac3" always;

        location / {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}

