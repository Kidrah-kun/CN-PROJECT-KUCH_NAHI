# dnsmasq Configuration — Mac 4 (Ayush Tiwari) — BACKUP DNS
# Computer Networks Project — Team Kuch_Nahi
# Phase 2 — Extension A: Backup DNS Resolver
#
# This file goes on Mac 4 at:
#   /opt/homebrew/etc/dnsmasq.conf
#
# Mac 4 acts as a SECONDARY/BACKUP DNS alongside Mac 1.
# Clients are configured with both DNS servers:
#   Primary:  10.7.7.36  (Mac 1 — Hardik)
#   Backup:   10.7.24.95 (Mac 4 — Ayush)
#
# When Mac 1's dnsmasq is stopped, clients still resolve via Mac 4.
#
# ─────────────────────────────────────────────────────────────

listen-address=127.0.0.1,10.7.24.95
bind-interfaces
no-resolv

server=8.8.8.8
server=1.1.1.1

# Same project domain records as primary DNS
address=/app.Kuch_Nahi.test/10.7.19.243
address=/api.Kuch_Nahi.test/10.7.19.243

# SHORT TTL for Phase 2 TTL demonstration (30 seconds)
local-ttl=30

log-queries
