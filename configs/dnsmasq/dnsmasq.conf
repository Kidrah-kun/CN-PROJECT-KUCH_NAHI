# dnsmasq Configuration — Mac 1 (Hardik Hathwal / Kidrah)
# Computer Networks Project — Team Kuch_Nahi
# Machine: Mac 1 — 10.7.7.36 — en0
#
# This file goes on Mac 1 at:
#   /opt/homebrew/etc/dnsmasq.conf
#
# To apply:
#   sudo brew services restart dnsmasq
#
# To test config syntax:
#   sudo /opt/homebrew/opt/dnsmasq/sbin/dnsmasq --test
#
# To check it is listening:
#   sudo lsof -nP -iUDP:53
#
# ─────────────────────────────────────────────────────────────

# Listen on localhost (for local testing) AND on Mac 1's LAN IP
listen-address=127.0.0.1,10.7.7.36

# Bind strictly to the interfaces above (do not use wildcard)
bind-interfaces

# Do NOT read /etc/resolv.conf — we control all upstreams manually
no-resolv

# Forward normal Internet queries to Google DNS
server=8.8.8.8
server=1.1.1.1

# ─── Private Project Domain Records ───────────────────────────
# Both names resolve to Mac 2 (Abuzar — 10.7.19.243 — nginx edge)
address=/app.Kuch_Nahi.test/10.7.19.243
address=/api.Kuch_Nahi.test/10.7.19.243

# TTL for project records (60 s for Phase 1; change to 30 s for Phase 2 TTL demo)
local-ttl=60

# Log all DNS queries (useful for debugging)
log-queries
